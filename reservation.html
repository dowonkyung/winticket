<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ahchwkcszyphbmppctbt.supabase.co; connect-src 'self' https://ahchwkcszyphbmppctbt.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'"><title>좌석 선택 | 윈트티켓</title><link rel="icon" href="assets/favicon.svg?v=brand-1"><link rel="stylesheet" href="assets/reservation.css?v=seats-1"></head><body>
 <main class="reservation-shell" id="reservation-shell" aria-busy="true">
  <section class="select-main"><header class="seat-top"><h1>좌석 선택</h1><p id="popup-title">공연 정보를 불러오는 중입니다.</p><label class="sr-only" for="popup-session">공연 회차</label><select id="popup-session"></select></header>
   <div id="popup-notice" class="popup-notice" role="status" hidden></div>
   <div class="stage-heading" id="stage-heading" hidden><div>무대방향 (STAGE)</div><p id="current-zone-label"></p></div>
   <div class="seat-scroll" id="seat-scroll"><div id="large-map" class="large-map"></div><div id="seat-grid" class="seat-grid" role="group" aria-label="구역별 좌석" hidden></div></div>
   <footer class="selected-bar"><button id="toggle-selected" type="button" aria-expanded="false">좌석을 선택해 주세요.<span>⌃</span></button><div id="selected-tray" hidden></div></footer>
  </section>
  <aside class="seat-sidebar"><a class="popup-brand" href="index.html" target="_blank" rel="noopener"><img src="assets/logo.svg?v=brand-1" alt="윈트티켓"></a>
   <section class="mini-area"><div class="mini-controls"><button id="map-zoom-in" type="button" aria-label="구역도 확대">＋</button><button id="map-zoom-out" type="button" aria-label="구역도 축소">－</button></div><div id="mini-map" class="mini-map"></div><button type="button" id="show-overview" class="overview-link">좌석도 전체보기 ›</button></section>
   <section class="grade-section"><div class="grade-heading"><h2>좌석등급/잔여석</h2><button type="button" id="seat-refresh">새로고침</button></div><div id="popup-grades" class="popup-grades"></div></section>
   <section id="popup-confirm" class="popup-confirm" hidden></section>
   <p id="popup-error" class="popup-error" role="alert" hidden></p><button type="button" id="seat-next" class="seat-next" disabled>좌석 선택 완료 <span>›</span></button>
  </aside>
 </main><script type="module" src="assets/reservation.js?v=members-1"></script></body></html>
