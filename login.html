<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://ahchwkcszyphbmppctbt.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'"><title>로그인 | 윈트티켓</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/login.css?v=dotum-1"></head><body><header><a href="index.html"><img src="assets/logo.svg" alt="윈트티켓"></a><a href="index.html">홈으로 돌아가기</a></header><main><h1 id="title">로그인</h1><p id="intro">공연의 설렘을 나의 계정에 담아보세요.</p><nav class="tabs" aria-label="계정 메뉴"><a id="login-tab" href="login.html">로그인</a><a id="signup-tab" href="login.html?mode=signup">회원가입</a></nav><div id="message" class="message" role="status" aria-live="polite" hidden></div><form id="auth-form"><div id="email-row"><label for="email">네이버 이메일</label><input id="email" type="email" name="email" autocomplete="username" placeholder="example@naver.com" maxlength="74" required><p class="hint">@naver.com 이메일을 아이디로 사용합니다.</p></div><div id="nickname-row" hidden><label for="nickname">닉네임</label><input id="nickname" name="nickname" autocomplete="nickname" minlength="2" maxlength="16" pattern="[가-힣A-Za-z0-9_]{2,16}" placeholder="닉네임을 입력해 주세요"><p class="hint">한글·영문·숫자·밑줄 2~16자 · 표시 이름으로 사용합니다.</p></div><div id="password-row"><label for="password">비밀번호</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required></div><div id="confirm-row" hidden><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128"></div><p id="signup-hint" class="hint" hidden>비밀번호 10자 이상 · 가입 확인 메일에서 인증을 완료해 주세요.<br>네이버 계정 비밀번호와 다른 비밀번호를 사용해 주세요.</p><button id="submit" type="submit" class="primary">로그인</button></form><div id="member-card" class="member-card" hidden></div><div class="links"><a id="recover-link" href="login.html?mode=recover">비밀번호 찾기</a><a href="myticket.html">마이티켓</a></div></main><footer>© WINTICKET. All rights reserved.</footer><script type="module" src="assets/login.js?v=members-1"></script></body></html>
